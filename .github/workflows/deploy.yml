name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      service_url: ${{ steps.apprunner.outputs.service_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-3' }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository
        env:
          REPO: chainlens-api
        run: |
          aws ecr describe-repositories --repository-names "$REPO" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$REPO" >/dev/null

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: chainlens-api
          SHA: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$REPO"
          docker build -t "$IMAGE:$SHA" -t "$IMAGE:latest" backend
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"
          echo "IMAGE_URI=$IMAGE:$SHA" >> "$GITHUB_ENV"

      - name: Create or update App Runner
        id: apprunner
        env:
          SERVICE_NAME: chainlens-api
          ACCESS_ROLE: ${{ vars.APP_RUNNER_ECR_ACCESS_ROLE_ARN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOLANA_RPC_URL: ${{ vars.SOLANA_RPC_URL || 'https://api.mainnet-beta.solana.com' }}
          MOCK_ANALYZE: ${{ vars.MOCK_ANALYZE || 'true' }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'https://chainlens-8or.pages.dev' }}
        run: |
          set -euo pipefail
          if [[ -z "${ACCESS_ROLE:-}" ]]; then
            echo "Set repository variable APP_RUNNER_ECR_ACCESS_ROLE_ARN" >&2
            exit 1
          fi
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "Set repository secret DATABASE_URL (TiDB)" >&2
            exit 1
          fi

          # Escape values for JSON embedding
          json_escape() { python3 -c 'import json,sys; print(json.dumps(sys.argv[1]))' "$1"; }
          DBU=$(json_escape "$DATABASE_URL")
          OAI=$(json_escape "${OPENAI_API_KEY:-}")
          RPC=$(json_escape "$SOLANA_RPC_URL")
          MOCK=$(json_escape "$MOCK_ANALYZE")
          CORS=$(json_escape "$CORS_ORIGINS")
          IMG=$(json_escape "$IMAGE_URI")

          SOURCE=$(cat <<EOF
          {
            "AuthenticationConfiguration": {"AccessRoleArn": "$ACCESS_ROLE"},
            "AutoDeploymentsEnabled": false,
            "ImageRepository": {
              "ImageIdentifier": $IMG,
              "ImageRepositoryType": "ECR",
              "ImageConfiguration": {
                "Port": "8000",
                "RuntimeEnvironmentVariables": {
                  "DATABASE_URL": $DBU,
                  "SOLANA_RPC_URL": $RPC,
                  "OPENAI_API_KEY": $OAI,
                  "MOCK_ANALYZE": $MOCK,
                  "CORS_ORIGINS": $CORS
                }
              }
            }
          }
          EOF
          )

          EXISTING=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME'].ServiceArn" --output text || true)
          if [[ -n "$EXISTING" && "$EXISTING" != "None" ]]; then
            echo "Updating App Runner service..."
            aws apprunner update-service \
              --service-arn "$EXISTING" \
              --source-configuration "$SOURCE" \
              --instance-configuration '{"Cpu":"1024","Memory":"2048"}' >/dev/null
            SERVICE_ARN="$EXISTING"
          else
            echo "Creating App Runner service..."
            CREATE_OUT=$(aws apprunner create-service \
              --service-name "$SERVICE_NAME" \
              --source-configuration "$SOURCE" \
              --instance-configuration '{"Cpu":"1024","Memory":"2048"}' \
              --health-check-configuration '{"Protocol":"HTTP","Path":"/health","Interval":10,"Timeout":5,"HealthyThreshold":1,"UnhealthyThreshold":5}')
            SERVICE_ARN=$(echo "$CREATE_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['Service']['ServiceArn'])")
          fi

          echo "Waiting for RUNNING..."
          URL=""
          for i in $(seq 1 90); do
            STATUS=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME'].Status" --output text)
            URL=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME'].ServiceUrl" --output text)
            echo "  status=$STATUS url=$URL"
            if [[ "$STATUS" == "RUNNING" ]]; then
              break
            fi
            if [[ "$STATUS" == "CREATE_FAILED" || "$STATUS" == "DELETE_FAILED" || "$STATUS" == "UPDATE_FAILED" ]]; then
              echo "App Runner failed: $STATUS" >&2
              exit 1
            fi
            sleep 10
          done
          if [[ -z "$URL" || "$URL" == "None" ]]; then
            echo "No ServiceUrl yet" >&2
            exit 1
          fi
          echo "service_url=https://${URL}" >> "$GITHUB_OUTPUT"
          echo "API available at https://${URL}"

  deploy-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build static export
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          if [[ -z "${NEXT_PUBLIC_API_URL:-}" ]]; then
            echo "Set repository variable NEXT_PUBLIC_API_URL" >&2
            exit 1
          fi
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy out --project-name=chainlens --commit-dirty=true
