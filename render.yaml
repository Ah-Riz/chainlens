# Render Blueprint — https://render.com/docs/blueprint-spec
# Native Python (not Docker): matches free-tier Web Service defaults.
services:
  - type: web
    name: chainlens-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: MOCK_ANALYZE
        value: "false"
      - key: SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: CORS_ORIGINS
        value: https://chainlens.ahmadmaulana.net,https://chainlens-8or.pages.dev,http://localhost:3000
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
