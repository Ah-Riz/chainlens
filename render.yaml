# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: chainlens-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MOCK_ANALYZE
        value: "true"
      - key: SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: CORS_ORIGINS
        value: https://chainlens.ahmadmaulana.net,https://chainlens-8or.pages.dev,http://localhost:3000
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
